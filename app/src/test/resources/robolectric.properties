# Robolectric for the whole test source set.
#
# graphicsMode=NATIVE is set here (not per class) because the native runtime must be loaded by
# the sandbox on the test thread. When the first native-graphics call came from a test class that
# ran earlier in a fork and touched a Bitmap on a background thread (coroutine/IO decode), the
# runtime could be loaded from that thread and JNI_OnLoad aborted the JVM with
# "JniConstants: Class not found: java/nio/DoubleBuffer" -> Gradle Test Executor exit 134,
# tests=0. That made full gates fail at random depending on fork composition.
# Keeping one graphics mode for the suite makes the load deterministic and on the right thread.
graphicsMode=NATIVE
