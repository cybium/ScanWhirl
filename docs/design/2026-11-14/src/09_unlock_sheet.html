<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="sw.css">
<style>
.ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--gold-soft);border:1px solid var(--gold-hair);margin:4px auto 0}
.ic .ms{font-size:32px;color:var(--gold)}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:12px;font-weight:700;margin:16px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:rgba(255,255,255,.08)}
.err{color:var(--bad);font-size:12.5px;font-weight:700;margin-top:8px;display:flex;gap:6px;align-items:center}
</style></head><body>
<div class="screen"><iframe src="01_home_A.html" style="position:absolute;inset:0;width:412px;height:915px;border:0"></iframe><div class="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="ic"><span class="ms f">lock</span></div>
    <div style="text-align:center;font-size:21px;font-weight:800;margin-top:12px">Rent agreement is protected</div>
    <div class="note" style="text-align:center;margin-top:6px">Enter its password to open it.</div>
    <div class="field" style="border-color:var(--bad);margin-top:18px"><span class="ms">key</span><span class="v">••••</span><span class="ms">visibility</span></div>
    <div class="err"><span class="ms f" style="font-size:16px">error</span>That password didn’t match. 4 tries left before a 30-second pause.</div>
    <div class="btn p" style="margin-top:16px">Open</div>
    <div class="or">or</div>
    <div class="btn o"><span class="ms" style="color:var(--cyan)">fingerprint</span>Use password saved in Vault</div>
    <div class="row" style="justify-content:space-between;margin-top:10px">
      <div class="btn t" style="color:var(--mid)">Cancel</div><div class="btn t">Remove protection…</div></div>
  </div>
</div></body></html>
