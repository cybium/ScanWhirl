# Cloud screen atlas: one throwaway emulator per leg, five looks, one APK.
# Nothing here runs on a developer PC (no Gradle, emulator or adb locally):
# the build job compiles, the matrix legs install and walk, artifacts are uploaded.
# Fictional documents/photos are generated at run time; no secrets, no app edits.
name: atlas

on:
  push:
    branches: ["ci/atlas-*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to atlas (empty = the commit that triggered the run)"
        required: false
        default: ""

concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Harness safety, selector and atlas helper tests (no device)
        run: |
          bash -n tools/e2e/smoke.sh tools/e2e/flows.sh tools/e2e/atlas.sh
          python3 -m unittest discover -s tools/e2e -p test_flow_driver.py -v
          python3 -m unittest discover -s tools/e2e -p test_atlas.py -v

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Assemble the test APK (com.scanwhirl.app.test)
        run: ./gradlew :app:assembleDebug -PtestBuild --no-daemon -q

      - name: Verify the test APK and record its hash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT2=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | sort -V | tail -n1)
          "$AAPT2" dump badging "$APK" | head -n 3 | tee badging.txt
          grep -q "package: name='com.scanwhirl.app.test'" badging.txt
          sha256sum "$APK" | tee apk-sha256.txt
          mkdir -p dist-apk
          cp "$APK" apk-sha256.txt dist-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: dist-apk/
          retention-days: 7

  atlas:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: light
            api: 35
            profile: pixel_6
            arch: x86_64
            setup: "true"
          - leg: dark
            api: 35
            profile: pixel_6
            arch: x86_64
            setup: "adb shell cmd uimode night yes"
          - leg: font200
            api: 35
            profile: pixel_6
            arch: x86_64
            setup: "adb shell settings put system font_scale 2.0"
          - leg: small24
            api: 24
            profile: Nexus 4
            arch: x86
            setup: "true"
          # Fifth leg: natural Hindi strings (values-hi) on the API 35 phone.
          - leg: hindi
            api: 35
            profile: pixel_6
            arch: x86_64
            setup: "adb shell cmd locale set-app-locales com.scanwhirl.app.test --locales hi-IN; adb shell settings put system system_locales hi-IN"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: test-apk
          path: test-apk

      - name: Check the test APK
        run: |
          set -euo pipefail
          ls -l test-apk
          test -s test-apk/app-debug.apk
          sha256sum -c <(sed "s#app/build/outputs/apk/debug/app-debug.apk#test-apk/app-debug.apk#" test-apk/apk-sha256.txt)

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Screen atlas (${{ matrix.leg }}, API ${{ matrix.api }}, ${{ matrix.profile }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            bash tools/e2e/atlas.sh
        env:
          LEG: ${{ matrix.leg }}
          API_LEVEL: ${{ matrix.api }}
          LEG_SETUP: ${{ matrix.setup }}
          ATLAS_MAX_MINUTES: "45"
          APK: ${{ github.workspace }}/test-apk/app-debug.apk
          OUT: ${{ github.workspace }}/artifacts/${{ matrix.leg }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-${{ matrix.leg }}
          path: artifacts/
          retention-days: 7
