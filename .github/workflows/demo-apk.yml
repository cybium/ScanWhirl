# ScanWhirl CI demo APK (lane CIAPK): build the throwaway, CI-signed demo package
# (com.scanwhirl.app.demo) on GitHub's free public-repo runners so the lead's 7 GB PC
# never runs Gradle. Manual trigger only; ref defaults to integration.
#
# Secrets (set once with `gh secret set`, never printed anywhere in this workflow):
#   DEMO_KEYSTORE_B64 - base64 of a demo-only JKS keystore (NOT the Play/release key)
#   DEMO_KEY_ALIAS    - alias inside that keystore
#   DEMO_KEY_PASS     - store/key password for that keystore
#
# The keystore is decoded to $RUNNER_TEMP, used for this one job, and removed in an
# always() step. No Play publication, no release signing, no secrets in logs.
name: demo-apk

on:
  # tools/demo_apk.ps1 pushes the commit to build as apk/<shortsha> (workflow_dispatch only
  # works for workflows on the default branch, which stays untouched).
  push:
    branches: ["apk/**"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build (default: integration)"
        required: false
        default: "integration"

concurrency:
  group: demo-apk-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Decode the demo keystore to a temp file
        env:
          DEMO_KEYSTORE_B64: ${{ secrets.DEMO_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$DEMO_KEYSTORE_B64" || { echo "DEMO_KEYSTORE_B64 is empty"; exit 1; }
          DEMO_KS="$RUNNER_TEMP/scanwhirl-demo.jks"
          printf '%s' "$DEMO_KEYSTORE_B64" | base64 --decode > "$DEMO_KS"
          test -s "$DEMO_KS" || { echo "decoded demo keystore is empty"; exit 1; }
          echo "DEMO_KEYSTORE_PATH=$DEMO_KS" >> "$GITHUB_ENV"

      - name: Assemble the signed demo APK
        env:
          DEMO_KEY_ALIAS: ${{ secrets.DEMO_KEY_ALIAS }}
          DEMO_KEY_PASS: ${{ secrets.DEMO_KEY_PASS }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug \
            -PtestBuild -PdemoBuild \
            -PdemoKeystore="$DEMO_KEYSTORE_PATH" \
            -PdemoKeyAlias="$DEMO_KEY_ALIAS" \
            -PdemoStorePass="$DEMO_KEY_PASS" \
            -PdemoKeyPass="$DEMO_KEY_PASS" \
            --no-daemon --stacktrace

      - name: Verify the demo package and stage the artifact
        id: verify
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || { echo "APK missing"; exit 1; }
          AAPT2=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | sort -V | tail -n1)
          "$AAPT2" dump badging "$APK" > badging-full.txt
          head -n 3 badging-full.txt | tee badging.txt
          grep -q "package: name='com.scanwhirl.app.demo'" badging.txt
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "shortsha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          mkdir -p dist-apk
          cp "$APK" dist-apk/app-debug.apk
          (cd dist-apk && sha256sum app-debug.apk > SHA256.txt)
          {
            echo "### CI demo APK"
            echo "ref: $REF (short SHA $SHORT_SHA)"
            echo '```'
            cat badging.txt dist-apk/SHA256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: demo-apk-${{ steps.verify.outputs.shortsha }}
          path: dist-apk/
          retention-days: 7
          if-no-files-found: error

      - name: Delete the temp keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/scanwhirl-demo.jks"
          if [ -n "${DEMO_KEYSTORE_PATH:-}" ] && [ "$DEMO_KEYSTORE_PATH" != "$RUNNER_TEMP/scanwhirl-demo.jks" ]; then
            rm -f "$DEMO_KEYSTORE_PATH"
          fi
