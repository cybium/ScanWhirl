# Automated INTERFACE MAP of the ScanWhirl demo APK on a throwaway GitHub
# emulator. No physical phone, no browser, no Play Billing, no ML Kit scanner.
# Fictional fixtures are generated on the runner; the whole UI is mapped into
# screenshots + a control -> result navigation graph for the phone QA agent.
#
# Triggers: push to uimap/** (the worker pushes HEAD:uimap/run) or dispatch.
name: uimap

on:
  push:
    branches: ["uimap/**"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to map (empty = triggering commit)"
        required: false
        default: ""

concurrency:
  group: uimap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Harness safety and selector tests (no device)
        run: python3 -m unittest discover -s tools/e2e -p "test_*.py" -v

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Assemble the DEMO test APK (com.scanwhirl.app.demo)
        run: ./gradlew :app:assembleDebug -PtestBuild -PdemoBuild --no-daemon -q

      - name: Verify the demo package and record its hash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT2=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | sort -V | tail -n1)
          "$AAPT2" dump badging "$APK" | head -n 3 | tee badging.txt
          grep -q "package: name='com.scanwhirl.app.demo'" badging.txt
          sha256sum "$APK" | tee apk-sha256.txt
          {
            echo "### Demo APK under test"
            echo '```'
            cat badging.txt apk-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p dist-apk
          cp "$APK" apk-sha256.txt dist-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: uimap-demo-apk
          path: dist-apk/
          retention-days: 7

  uimap:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: uimap-demo-apk
          path: test-apk

      - name: Check the demo APK
        run: |
          set -euo pipefail
          ls -l test-apk
          test -s test-apk/app-debug.apk
          sha256sum -c <(sed "s#app/build/outputs/apk/debug/app-debug.apk#test-apk/app-debug.apk#" test-apk/apk-sha256.txt)

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build the interface map (API 35, pixel_6)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            python3 tools/e2e/uimap.py
        env:
          API_LEVEL: 35
          APK: ${{ github.workspace }}/test-apk/app-debug.apk
          OUT: ${{ github.workspace }}/artifacts/uimap
          UIMAP_PKG: com.scanwhirl.app.demo

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uimap-api35
          path: artifacts/
          retention-days: 7
