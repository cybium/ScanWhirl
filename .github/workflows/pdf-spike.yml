name: PDF engine spike

on:
  push:
    branches:
      - spike/pdf-engine
  workflow_dispatch:

jobs:
  apk-sizes:
    name: Measure APK sizes (with and without engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APKs
        run: ./gradlew :app:assembleRelease :baseline:assembleRelease --stacktrace

      - name: Verify no INTERNET permission
        run: |
          MANIFEST=app/build/intermediates/merged_manifest/release/AndroidManifest.xml
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "ERROR: INTERNET permission leaked into the merged manifest"
            exit 1
          fi
          echo "Merged manifest has no INTERNET permission"

      - name: Record APK sizes
        run: |
          A_ARM=$(stat -c %s app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk)
          A_UNI=$(stat -c %s app/build/outputs/apk/release/app-universal-release-unsigned.apk)
          B_ARM=$(stat -c %s baseline/build/outputs/apk/release/baseline-arm64-v8a-release-unsigned.apk)
          B_UNI=$(stat -c %s baseline/build/outputs/apk/release/baseline-universal-release-unsigned.apk)
          jq -n \
            --argjson app_arm64 "$A_ARM" \
            --argjson app_universal "$A_UNI" \
            --argjson baseline_arm64 "$B_ARM" \
            --argjson baseline_universal "$B_UNI" \
            '{
              app_arm64_v8a_bytes: $app_arm64,
              baseline_arm64_v8a_bytes: $baseline_arm64,
              delta_arm64_v8a_bytes: ($app_arm64 - $baseline_arm64),
              app_universal_bytes: $app_universal,
              baseline_universal_bytes: $baseline_universal,
              delta_universal_bytes: ($app_universal - $baseline_universal),
              engine: "com.tom-roush:pdfbox-android:2.0.27.0"
            }' > apk-sizes.json
          cat apk-sizes.json

      - name: Upload APK size numbers
        uses: actions/upload-artifact@v4
        with:
          name: apk-sizes
          path: apk-sizes.json

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: spike-apks
          path: |
            app/build/outputs/apk/release/*.apk
            baseline/build/outputs/apk/release/*.apk

  connected-tests:
    name: On-device measurements (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            profile: Nexus 5
          - api: 34
            profile: pixel_2
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
          sudo usermod -aG kvm "$USER"
          # The action checks /dev/kvm access at startup; make it writable now.
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -l /dev/kvm || true

      - name: Run connected tests on API ${{ matrix.api }} (x86_64, 2048M RAM)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 2048M
          sdcard-path-or-size: 1024M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          script: |
            ( for i in $(seq 1 180); do if adb pull /sdcard/Android/data/com.scanwhirl.spike.pdf/files/pdf_spike_results.json results-api-${{ matrix.api }}.json 2>/dev/null && [ -s results-api-${{ matrix.api }}.json ]; then break; fi; sleep 2; done ) & P=$!; ./gradlew :app:connectedDebugAndroidTest --stacktrace || echo failed > gradle-failed.txt; wait $P; test ! -f gradle-failed.txt
            if [ ! -s results-api-${{ matrix.api }}.json ]; then adb pull /sdcard/pdf_spike_results.json results-api-${{ matrix.api }}.json || true; fi
            if [ ! -s results-api-${{ matrix.api }}.json ]; then adb pull /sdcard/Download/pdf_spike_results.json results-api-${{ matrix.api }}.json || true; fi

      - name: Verify and show JSON results
        if: always()
        run: |
          test -s results-api-${{ matrix.api }}.json
          cat results-api-${{ matrix.api }}.json

      - name: Upload measurement JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-results-api-${{ matrix.api }}
          path: results-api-${{ matrix.api }}.json
          if-no-files-found: error
