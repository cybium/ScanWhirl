name: W7a PDF engine size measurement

on:
  push:
    branches: ["ci/ovh-w7a"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minified release APK (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: branch
            ref: ${{ github.sha }}
          - label: base
            ref: f9031f9e49e8790a3217327797ff87728b8e8839
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Assemble minified release APK (R8 + shrinking, no keystore)
        run: |
          set -e
          ./gradlew :app:assembleRelease -PciUnsignedRelease --no-daemon --stacktrace > r8-build.log 2>&1 || {
            grep -n "e: " r8-build.log | head -n 40 || true
            tail -n 60 r8-build.log
            exit 1
          }
          tail -n 20 r8-build.log

      - name: Release runtime must not contain Bouncy Castle (branch only)
        if: matrix.label == 'branch'
        run: |
          set -e
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath -PciUnsignedRelease --no-daemon > release-deps.txt
          if grep -q 'org.bouncycastle' release-deps.txt; then
            echo "::error::org.bouncycastle leaked into releaseRuntimeClasspath"
            grep 'org.bouncycastle' release-deps.txt
            exit 1
          fi
          echo "releaseRuntimeClasspath is free of org.bouncycastle"

      - name: Minified APK keeps PDFBox assets and font classes (branch only)
        if: matrix.label == 'branch'
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -q 'assets/com/tom_roush/pdfbox/resources/afm/Helvetica.afm'
          unzip -l "$APK" | grep -q 'assets/com/tom_roush/pdfbox/resources/glyphlist/glyphlist.txt'
          grep -q 'com.tom_roush.pdfbox.pdmodel.font.PDType1Font' app/build/outputs/mapping/release/mapping.txt
          echo "AAR resources and kept font classes are present in the minified APK"

      - name: Record APK bytes and dex method ids
        run: |
          python3 - <<'PY' > size-${{ matrix.label }}.txt
          import glob, os, struct, zipfile
          apks = sorted(glob.glob("app/build/outputs/apk/release/*.apk"))
          assert apks, "no release APK"
          for apk in apks:
              z = zipfile.ZipFile(apk)
              methods = 0
              for name in z.namelist():
                  if name.startswith("classes") and name.endswith(".dex"):
                      data = z.read(name)
                      # dex_header.method_ids_size, little-endian, offset 56
                      methods += struct.unpack_from("<I", data, 56)[0]
              print(f"apk={os.path.basename(apk)} bytes={os.path.getsize(apk)} dex_method_ids={methods}")
          PY
          cat size-${{ matrix.label }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: w7a-size-${{ matrix.label }}
          path: size-${{ matrix.label }}.txt
          retention-days: 7

  compare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: sizes

      - name: Compute exact deltas
        run: |
          python3 - <<'PY' | tee w7a-size-report.txt | tee "$GITHUB_STEP_SUMMARY"
          import glob, re
          def read(label):
              files = glob.glob(f"sizes/w7a-size-{label}/size-{label}.txt")
              assert files, f"missing artifact for {label}"
              rows = {}
              for line in open(files[0]):
                  m = re.match(r"apk=(\S+) bytes=(\d+) dex_method_ids=(\d+)", line.strip())
                  if m: rows[m.group(1)] = (int(m.group(2)), int(m.group(3)))
              assert rows, "no APK rows"
              return rows
          branch = read("branch")
          base = read("base")
          print("### W7a minified release APK delta (branch - base)")
          print("| APK | base bytes | branch bytes | delta bytes | base methods | branch methods | delta methods |")
          print("|---|---:|---:|---:|---:|---:|---:|")
          for apk in sorted(set(branch) | set(base)):
              b, bm = base.get(apk, (0, 0))
              c, cm = branch.get(apk, (0, 0))
              print(f"| {apk} | {b} | {c} | {c-b} | {bm} | {cm} | {cm-bm} |")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: w7a-size-report
          path: w7a-size-report.txt
          retention-days: 7

  minified-smoke:
    name: Minified runtime smoke (R8 keep rules on device)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # Installs the R8-minified release APK plus the androidTest APK and runs the plain
      # androidx Instrumentation MinifiedEngineInstrumentation against the minified
      # classes. It runs the workflow on an instrumentation thread with the production
      # main-thread guard disabled, then separately asserts the guard fires on Main.
      - name: Run engine smoke on the minified release build
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          script: |
            set -e
            set -o pipefail
            printf "allprojects { p -> p.plugins.withId('com.android.application') { p.extensions.getByName('android').defaultConfig.testInstrumentationRunner = 'com.scanwhirl.app.pdf.engine.MinifiedEngineInstrumentation' } }\n" > w7a-init.gradle
            ./gradlew :app:assembleRelease :app:assembleDebugAndroidTest -PciUnsignedRelease -I w7a-init.gradle --no-daemon --stacktrace
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm list instrumentation | grep -i scanwhirl || true
            adb shell am instrument -w com.scanwhirl.app.test/com.scanwhirl.app.pdf.engine.MinifiedEngineInstrumentation | tee minified-instrument.log || true
            cat minified-instrument.log
            grep -q "minified engine workflow OK" minified-instrument.log
