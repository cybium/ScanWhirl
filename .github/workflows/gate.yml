# ScanWhirl cloud gate: the full Robolectric suite (+ lint on integration) on GitHub's 16 GB runners,
# and the minified release build (R8 + resource shrinking) without the owner's keystore.
# Triggered by tools/gate.ps1 -Cloud (pushes a working-tree snapshot to ci/<lane>) and by pushes to integration.
# No secrets are used: release signing stays on the owner's PC ([release] signs with the debug key),
# test builds (-PtestBuild) need no keystore.
name: gate

on:
  push:
    branches: ["ci/**", "integration"]
  workflow_dispatch:
    inputs:
      lint:
        description: "Also run lint"
        type: boolean
        default: false

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 3,500+ Robolectric tests + lint + the merged-manifest privacy build exceed 20 minutes.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Robolectric downloads its android-all jars from Maven Central at test time; Maven 429s
      # failed whole runs. Keep them cached between runs (keyed by the Robolectric version).
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-m2-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts') }}
          restore-keys: robolectric-m2-

      # Fetch the android-all jars up front with retry/backoff so a Maven 429 cannot fail 3,000 tests.
      - name: Prefetch Robolectric android-all jars (retry)
        run: |
          set -euo pipefail
          base=https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented
          for v in 15-robolectric-12650502-i7 12.1-robolectric-8229987-i7 9-robolectric-4913185-2-i7 8.1.0-robolectric-4611349-i7; do
            dir="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$v"
            mkdir -p "$dir"
            for f in "android-all-instrumented-$v.pom" "android-all-instrumented-$v.pom.sha512" "android-all-instrumented-$v.jar.sha512" "android-all-instrumented-$v.jar"; do
              if [ ! -s "$dir/$f" ]; then
                curl -fsSL --retry 10 --retry-delay 15 --retry-all-errors --connect-timeout 30 -o "$dir/$f.part" "$base/$v/$f"
                mv "$dir/$f.part" "$dir/$f"
              fi
            done
            want=$(cut -c1-128 "$dir/android-all-instrumented-$v.jar.sha512")
            got=$(sha512sum "$dir/android-all-instrumented-$v.jar" | cut -c1-128)
            if [ "$want" != "$got" ]; then echo "::error::sha512 mismatch for $v"; rm -f "$dir/android-all-instrumented-$v.jar"; exit 1; fi
          done

      # The verdict script must reject every known false-green case before it judges this run.
      - name: Verdict self-test (control cases)
        run: python3 tools/ci/test_gate_verdict.py

      - name: Unit tests
        id: tests
        continue-on-error: true
        # gate.ps1 -Tests "<pattern>" (when the PC's build slot is busy) injects .ci/test-filter.txt.
        run: |
          set +e
          FILTER=""
          if [ -f .ci/test-filter.txt ]; then FILTER=$(head -n1 .ci/test-filter.txt | tr -d '\r'); echo "test filter: $FILTER"; fi
          ARGS=()
          if [ -n "$FILTER" ]; then
            # "A,B" -> --tests A --tests B (Gradle takes one pattern per flag)
            IFS=',' read -ra PATS <<< "$FILTER"
            for p in "${PATS[@]}"; do p="$(echo "$p" | xargs)"; [ -n "$p" ] && ARGS+=(--tests "$p"); done
          fi
          run_tests() {
            ./gradlew :app:testDebugUnitTest -PtestBuild -PtestHeap=4g -PtestForkEvery=200 --continue --no-daemon -q "${ARGS[@]}" 2>&1 | tee tests.log
            return ${PIPESTATUS[0]}
          }
          run_tests; code=$?
          # Robolectric's native graphics runtime sometimes aborts a whole test JVM
          # ("JniConstants: Class not found: java/nio/DoubleBuffer", exit 134) depending on which
          # tests share a fork. That is a test-infrastructure crash, not a test result: retry ONCE,
          # and only for that exact signature. Real test failures are never retried.
          # A snapshot that contains .ci/no-retry (root-cause investigation) never retries.
          if [ $code -ne 0 ] && [ ! -f .ci/no-retry ] && grep -q "JniConstants: Class not found" tests.log; then
            echo "::warning::Robolectric native runtime abort (DoubleBuffer) - retrying the test task once"
            rm -rf app/build/test-results/testDebugUnitTest
            run_tests; code=$?
          fi
          # Known runner-sensitive tests (wall-clock budget on a shared runner, a deliberate OOM
          # probe, a timing-sensitive export check). If they are the ONLY failing classes, re-run
          # just those classes once and keep every other result from the full run. Any other
          # failure is never retried.
          if [ $code -ne 0 ] && [ ! -f .ci/no-retry ]; then
            FLAKY=$(python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          known = {"ScanEnhanceQualityTest", "PageNormalizationTest", "ExportHygieneTest"}
          failing = set()
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              if int(r.get("failures", 0)) + int(r.get("errors", 0)) > 0:
                  failing.add(r.get("name"))
          short = {n.split(".")[-1] for n in failing}
          print(",".join(sorted(failing)) if failing and short <= known else "")
          PY
            )
            if [ -n "$FLAKY" ]; then
              echo "::warning::only known runner-sensitive tests failed ($FLAKY) - re-running just those once"
              rm -rf /tmp/keep && mkdir -p /tmp/keep && cp -r app/build/test-results/testDebugUnitTest /tmp/keep/
              RARGS=(); IFS=',' read -ra FL <<< "$FLAKY"; for c in "${FL[@]}"; do RARGS+=(--tests "$c"); done
              ./gradlew :app:testDebugUnitTest -PtestBuild -PtestHeap=4g --continue --no-daemon -q "${RARGS[@]}" 2>&1 | tee -a tests.log
              code=${PIPESTATUS[0]}
              cp app/build/test-results/testDebugUnitTest/*.xml /tmp/keep/testDebugUnitTest/ 2>/dev/null || true
              rm -rf app/build/test-results/testDebugUnitTest && cp -r /tmp/keep/testDebugUnitTest app/build/test-results/
            fi
          fi
          exit $code

      - name: Lint
        id: lint
        # Lint on integration AND on every full lane gate (ci/<lane>), so a lane cannot report
        # DONE with a lint error (11-18: uiicons slipped a WrongConstant). Targeted -Tests runs
        # (ci/<lane>-t) stay fast and skip it.
        if: github.ref == 'refs/heads/integration' || inputs.lint || (startsWith(github.ref, 'refs/heads/ci/') && !endsWith(github.ref, '-t'))
        continue-on-error: true
        run: ./gradlew :app:lintDebug -PtestBuild --no-daemon -q

      - name: Merged release manifest privacy gate
        # P lane, fail closed: build the RELEASE manifest and generated BuildConfig (no
        # -PtestBuild), then reject INTERNET / ACCESS_NETWORK_STATE / FOREGROUND_SERVICE* /
        # AD_ID / QUERY_ALL_PACKAGES and any test-build value. No signing key is used.
        # Deliberately NOT continue-on-error: a failure must fail the whole run, which
        # gate.ps1 turns into GATE FAIL even if the test Summary printed GATE PASS.
        run: |
          set -e
          ./gradlew :app:processReleaseManifest :app:generateReleaseBuildConfig -PciUnsignedRelease --no-daemon --stacktrace > manifest-gate-build.log 2>&1 || {
            tail -n 80 manifest-gate-build.log
            exit 1
          }
          MANIFEST=$(find app/build/intermediates -type f -path '*release*processReleaseManifest*AndroidManifest.xml' | head -n1)
          [ -n "$MANIFEST" ] || { echo "merged release manifest not found"; exit 1; }
          BUILDCONFIG=$(find app/build/generated -type f -path '*release*com/scanwhirl/app/BuildConfig.java' | head -n1)
          [ -n "$BUILDCONFIG" ] || { echo "release BuildConfig.java not found"; exit 1; }
          python3 tools/release/check_release_manifest.py "$MANIFEST" --build-config "$BUILDCONFIG"
          python3 -m unittest tools.release.tests.test_release -v

      - name: Summary
        if: always()
        # Fail closed (tools/ci/gate_verdict.py): PASS needs the real Gradle step outcomes, complete
        # test XML, and - wherever lint is required - a successful lint step WITH its report.
        # "|| true": this step only writes gate-result.txt; the Verdict step decides.
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          LINT_REQUIRED: ${{ github.ref == 'refs/heads/integration' || inputs.lint == true || (startsWith(github.ref, 'refs/heads/ci/') && !endsWith(github.ref, '-t')) }}
          # A full (unfiltered) run with fewer tests than this is an incomplete run (crashed fork etc.).
          # Baseline cd571b4 ran 1822 tests; lower this only together with a deliberate test removal.
          MIN_FULL_TESTS: "1800"
        run: python3 tools/ci/gate_verdict.py test || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-result
          path: |
            gate-result.txt
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/test-results/testDebugUnitTest/w5e-renders/*.png
            app/build/test-results/testDebugUnitTest/w5e-renders/manifest.txt
            app/build/reports/lint-results-debug.txt
          retention-days: 7

      - name: Verdict
        if: always()
        run: grep -q "^GATE PASS" gate-result.txt

  release:
    # Production build as shipped to Play apart from the signing key: R8
    # minification and resource shrinking run exactly as in a store build. The
    # runner never has the owner's keystore, so -PciUnsignedRelease swaps in the
    # debug signing config: the APK installs for a device smoke test and must
    # never be distributed. Fails on R8 errors or unresolved (missing) classes.
    # Only where it matters: integration merges, manual runs, and lanes that ask for it (ci/<lane>-rel*).
    if: github.ref == 'refs/heads/integration' || github.event_name == 'workflow_dispatch' || contains(github.ref, '-rel')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Assemble release (R8) and bundle (AAB)
        id: assemble
        continue-on-error: true
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease -PciUnsignedRelease --no-daemon --stacktrace > r8-build.log 2>&1
          tail -n 60 r8-build.log

      - name: R8 report
        if: always()
        # Fail closed: RELEASE PASS also requires the Gradle assemble step to have succeeded.
        env:
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
        run: python3 tools/ci/gate_verdict.py release || true

      - name: AAB per-device size (bundletool)
        if: always()
        # Diagnostic only: never fail the release job, and always leave aab-size.txt.
        continue-on-error: true
        run: |
          set +e
          AAB=app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB" ]; then echo "no AAB (see the R8 report)" > aab-size.txt; exit 0; fi
          # bundletool turns the AAB into the exact per-device APK set Play would serve.
          BT_URL=$(curl -fsSL --max-time 60 https://api.github.com/repos/google/bundletool/releases/latest 2>/dev/null \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print([a["browser_download_url"] for a in d["assets"] if a["name"].startswith("bundletool-all")][0])' 2>/dev/null)
          if [ -z "$BT_URL" ]; then
            BT_URL=https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          fi
          curl -fsSL --max-time 180 -o bundletool.jar "$BT_URL" || rm -f bundletool.jar
          # bundletool has to sign the generated APKs; a throwaway key is enough for
          # measuring sizes (signing bytes are the same for any RSA key).
          keytool -genkeypair -keystore ci-debug.jks -storepass android -keypass android \
            -alias ci -dname "CN=CI" -keyalg RSA -keysize 2048 -validity 10000 > /dev/null 2>&1
          # Fallback estimate: a device APK = shared dex/res/assets + its own ABI's libs.
          cat > aab-estimate.py <<'PY'
          import zipfile
          z = zipfile.ZipFile("app/build/outputs/bundle/release/app-release.aab")
          total = 0
          libs = {}
          for i in z.infolist():
              total += i.compress_size
              if i.filename.startswith("base/lib/"):
                  abi = i.filename.split("/")[2]
                  libs[abi] = libs.get(abi, 0) + i.compress_size
          shared = total - sum(libs.values())
          print(f"shared (dex+res+assets) {shared / 1048576:.1f} MiB")
          for abi, size in sorted(libs.items()):
              print(f"{abi}: {(shared + size) / 1048576:.1f} MiB")
          PY
          {
            echo "aab=$(basename "$AAB") size=$(stat -c %s "$AAB") bytes"
            if [ -s bundletool.jar ] && java -jar bundletool.jar version; then
              java -jar bundletool.jar build-apks --bundle="$AAB" --output=app.apks --mode=default \
                --ks=ci-debug.jks --ks-pass=pass:android \
                --ks-key-alias=ci --key-pass=pass:android --overwrite > bundletool.log 2>&1
              echo "--- get-size total (min/max across device configurations) ---"
              java -jar bundletool.jar get-size total --apks=app.apks
              echo "--- get-size total --dimensions=ABI ---"
              java -jar bundletool.jar get-size total --apks=app.apks --dimensions=ABI
            else
              echo "bundletool unavailable; estimating from the AAB"
              python3 aab-estimate.py
            fi
          } 2>&1 | tee aab-size.txt
          {
            echo "### AAB / per-device size"
            echo '```'
            cat aab-size.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/missing_rules.txt
            app/build/outputs/mapping/release/configuration.txt
            app/build/outputs/mapping/release/seeds.txt
            app/build/outputs/mapping/release/usage.txt
            r8-build.log
            release-result.txt
            aab-size.txt
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-aab
          path: |
            app/build/outputs/bundle/release/*.aab
            aab-size.txt
            bundletool.log
          retention-days: 7

      - name: Verdict
        if: always()
        run: grep -q "^RELEASE PASS" release-result.txt
